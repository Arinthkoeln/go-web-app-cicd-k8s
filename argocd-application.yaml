apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Arinthkoeln/go-web-app-cicd-k8s.git
    targetRevision: main
    path: helm/go-web-app-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true      # delete resources that no longer exist in git
      selfHeal: true   # revert manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
